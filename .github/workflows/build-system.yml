name: Build System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-cpp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make
      - name: Build exchange_core
        run: |
          cmake -B exchange_core/build -S exchange_core -DCMAKE_BUILD_TYPE=Release
          cmake --build exchange_core/build -j$(nproc)

  build-go-gateway:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build FIX gateway
        working-directory: fix_gateway
        run: go build ./...
      - name: Test FIX gateway
        working-directory: fix_gateway
        run: go test ./...

  build-go-market-data:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build market_data_api
        working-directory: market_data_api
        run: go build ./...

  build-ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build
        working-directory: trading_terminal
        run: npm install && npm run build
