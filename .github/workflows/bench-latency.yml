name: Latency Benchmark

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # weekly Monday 02:00 UTC

jobs:
  bench-latency:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make python3

      - name: Build exchange_core (Release + O3)
        run: |
          cmake -B exchange_core/build -S exchange_core \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -march=native"
          cmake --build exchange_core/build -j$(nproc)

      - name: Run order-throughput benchmark
        run: |
          set -euo pipefail
          exchange_core/build/exchange_core 0 | tee bench_output.txt
          grep -E "\[ExchangeCore\].*orders/sec" bench_output.txt
          grep -E "\[ExchangeCore\].*trades executed" bench_output.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench_output.txt
